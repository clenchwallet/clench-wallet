// Read-only dependency resolution evidence. Run with the normal strict Gradle verification policy.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportNativeRuntimeArtifacts') {
        doLast {
            def config = app.configurations.getByName('releaseRuntimeClasspath')
            def modules = config.incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { "${it.group}:${it.module}:${it.version}".toString() }.sort()
            def artifacts = config.resolvedConfiguration.resolvedArtifacts.collect {
                [coordinate: it.moduleVersion.id.toString(), name: it.file.name, file: it.file.absolutePath]
            }.unique { it.coordinate + ":" + it.name + ":" + it.file }.sort { a, b -> (a.coordinate + a.name) <=> (b.coordinate + b.name) }
            def output = gradle.rootProject.layout.buildDirectory.file('reports/native-runtime-artifacts.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, modules: modules, artifacts: artifacts])) + '\n'
            println 'Resolved runtime artifact manifest written to build/reports/native-runtime-artifacts.json'
        }
    }
}
