name: SQLCipher provenance candidate
on:
  push:
    branches: [audit/sqlcipher-provenance-20260920]
permissions:
  contents: read
jobs:
  native-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install generator and pinned NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
      - name: Build all shipped ABIs from pinned sources
        run: python3 scripts/native/build-sqlcipher-candidate.py --output build/sqlcipher-candidate
      - name: Retain experimental output and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlcipher-candidate-${{ matrix.os }}
          path: |
            build/sqlcipher-candidate/provenance.json
            build/sqlcipher-candidate/libs
            build/sqlcipher-candidate/*.log
            build/sqlcipher-candidate/*-readelf.txt
          if-no-files-found: error
          retention-days: 14
