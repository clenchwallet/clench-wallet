name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate GitHub Actions workflow schema and expressions
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_DIR="$RUNNER_TEMP/actionlint-$ACTIONLINT_VERSION"
          mkdir -p "$ACTIONLINT_DIR"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            -fsSLo "$ACTIONLINT_DIR/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            -fsSLo "$ACTIONLINT_DIR/checksums.txt" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          PUBLISHED_SHA256="$(
            awk -v name="$ACTIONLINT_ARCHIVE" '$2 == name { print $1 }' \
              "$ACTIONLINT_DIR/checksums.txt"
          )"
          ACTUAL_SHA256="$(
            sha256sum "$ACTIONLINT_DIR/$ACTIONLINT_ARCHIVE" | awk '{print $1}'
          )"
          test -n "$PUBLISHED_SHA256"
          test "$PUBLISHED_SHA256" = "$ACTIONLINT_SHA256"
          test "$ACTUAL_SHA256" = "$ACTIONLINT_SHA256"
          tar -xzf "$ACTIONLINT_DIR/$ACTIONLINT_ARCHIVE" \
            -C "$ACTIONLINT_DIR" actionlint
          "$ACTIONLINT_DIR/actionlint" -version
          "$ACTIONLINT_DIR/actionlint" -no-color -oneline -shellcheck= \
            .github/workflows/*.yml

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build, test, and lint
        env:
          CLENCH_FUZZ_CASES: 1024
        run: ./gradlew --no-daemon --dependency-verification=strict assembleDebug testDebugUnitTest lint

      - name: Run extended hostile protocol fuzz lane
        run: scripts/verification/run-hostile-fuzz.sh 5000

      - name: Require committed Room schemas
        run: git diff --exit-code -- app/schemas

      - name: Verify release controls and deterministic dependency evidence
        env:
          CLENCH_REQUIRE_NO_LOCAL_SIGNING_MATERIAL: 1
        run: |
          scripts/release/verify-release-controls.py
          python3 -B scripts/verification/test-release-tools.py
          mkdir -p build/verification
          scripts/release/generate-sbom.py \
            --commit "$GITHUB_SHA" \
            --output build/verification/sbom-first.cdx.json
          scripts/release/generate-sbom.py \
            --commit "$GITHUB_SHA" \
            --output build/verification/sbom-second.cdx.json
          cmp build/verification/sbom-first.cdx.json build/verification/sbom-second.cdx.json
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          scripts/release/validate-sbom.py \
            build/verification/sbom-first.cdx.json \
            --version "$VERSION" \
            --commit "$GITHUB_SHA"

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Rename APK with version
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/clench-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clench-${{ steps.version.outputs.VERSION }}-debug
          path: app/build/outputs/apk/debug/clench-${{ steps.version.outputs.VERSION }}-debug.apk
          retention-days: 3

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Lint Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3
