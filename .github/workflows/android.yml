name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build, test, and lint
        run: ./gradlew --no-daemon --dependency-verification=strict assembleDebug testDebugUnitTest lint

      - name: Require committed Room schemas
        run: git diff --exit-code -- app/schemas

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Rename APK with version
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/clench-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clench-${{ steps.version.outputs.VERSION }}-debug
          path: app/build/outputs/apk/debug/clench-${{ steps.version.outputs.VERSION }}-debug.apk
          retention-days: 3

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Lint Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3
