name: Hostile Protocol Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 0'

permissions:
  contents: read

concurrency:
  group: hostile-protocol-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic_fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Require a no-signing-material checkout
        env:
          CLENCH_REQUIRE_NO_LOCAL_SIGNING_MATERIAL: 1
        run: scripts/release/verify-release-controls.py

      - name: Run deterministic hostile protocol fuzzing
        run: scripts/verification/run-hostile-fuzz.sh 5000
